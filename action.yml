name: Statsay
description: Find localized game text that contradicts the game data it describes.
branding:
  icon: check-square
  color: blue

inputs:
  path:
    description: statsay.yaml, or the directory that contains it.
    default: "."
  base-ref:
    description: Git revision for diff mode. Defaults to the pull request's base branch; empty outside PRs.
    default: ""
  fail-on:
    description: Lowest severity of a new finding that fails the job (error, warning, info, never).
    default: error
  baseline:
    description: Baseline file of reviewed findings to suppress.
    default: ""
  upload-sarif:
    description: Upload SARIF to code scanning (needs security-events write; skipped on fork PRs).
    default: "true"
  comment:
    description: Create or update one PR comment with the summary (needs pull-requests write; skipped on fork PRs).
    default: "false"
  python-version:
    default: "3.11"

outputs:
  exit-code:
    description: statsay's exit code (0 clean, 1 findings at or above fail-on, 2 configuration error).
    value: ${{ steps.check.outputs.exit-code }}
  sarif:
    description: Path of the SARIF file.
    value: ${{ steps.check.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Statsay
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Check
      id: check
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        PR_BASE: ${{ github.base_ref }}
      run: bash "${{ github.action_path }}/ci/run-check.sh"

    # Fork PRs get a read-only token: no SARIF upload, no comment.
    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.check.outputs.sarif != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.check.outputs.sarif }}
        category: statsay

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: bash "${{ github.action_path }}/ci/comment.sh"

    - name: Result
      shell: bash
      run: exit "${{ steps.check.outputs.exit-code || 2 }}"
